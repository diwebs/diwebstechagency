<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="none" fill-rule="evenodd">
    <!-- Tether (USDT) green circle background -->
    <circle cx="16" cy="16" r="16" fill="#26A17B"/>
    <!-- Tether official wordmark icon: horizontal T-bar + narrow stem -->
    <!-- Top horizontal bar -->
    <rect x="6.5" y="8.5" width="19" height="3.5" rx="1.75" fill="white"/>
    <!-- Center vertical stem (wider at top, slightly narrowed) -->
    <rect x="14.1" y="11.5" width="3.8" height="2.7" fill="white"/>
    <!-- Text "T" stem body -->
    <rect x="14.1" y="14.2" width="3.8" height="7" rx="1.9" fill="white"/>
    <!-- Underline / base arc ring (the characteristic Tether underline) -->
    <path d="M10,19.8 Q16,22.5 22,19.8" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
