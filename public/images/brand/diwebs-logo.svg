<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Premium gradient matching the modern deep teal color in the logo -->
    <linearGradient id="teal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007F94"/>
      <stop offset="100%" stop-color="#00AEC9"/>
    </linearGradient>
    <!-- Matte grey matching the outer shape -->
    <linearGradient id="grey-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606266"/>
      <stop offset="100%" stop-color="#4C4E52"/>
    </linearGradient>
  </defs>

  <!-- Grey "D" body path -->
  <path d="M 17.5, 20 
           L 47.5, 20 
           C 67.5, 20 82.5, 30 82.5, 50 
           C 82.5, 70 67.5, 80 37.5, 80 
           L 42.5, 63 
           C 59.5, 63 65.5, 58 65.5, 50 
           C 65.5, 42 59.5, 37 47.5, 37 
           L 29.5, 37 
           L 17.5, 20 Z" 
        fill="url(#grey-grad)"/>

  <!-- Teal "i" dot -->
  <circle cx="35.5" cy="47" r="6" fill="url(#teal-grad)"/>

  <!-- Teal "i" stem path -->
  <path d="M 29.5, 61 
           L 41.5, 61 
           L 41.5, 63 
           L 42.5, 63 
           L 37.5, 80 
           C 31.5, 80 29.5, 75 29.5, 68 Z" 
        fill="url(#teal-grad)"/>
</svg>
