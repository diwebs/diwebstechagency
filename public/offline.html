<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline Access - Diwebs Tech Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark-primary: #2F3136;
            --brand-dark-secondary: #1E2125;
            --brand-teal: #0097A7;
            --brand-cyan: #00C2D1;
            --brand-white: #F8FAFC;
            --brand-gray: #94A3B8;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--brand-dark-secondary);
            font-family: 'Outfit', 'Inter', sans-serif;
            color: var(--brand-white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Tech Grid and Neon Blur Background Spheres */
        .tech-grid {
            position: fixed;
            inset: 0;
            z-index: -10;
            opacity: 0.15;
            pointer-events: none;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 151, 167, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 151, 167, 0.2) 1px, transparent 1px);
        }
        .blur-sphere {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: rgba(0, 151, 167, 0.08);
            filter: blur(120px);
            z-index: -9;
            pointer-events: none;
        }
        .blur-sphere-1 {
            top: -10%;
            left: -10%;
        }
        .blur-sphere-2 {
            bottom: -10%;
            right: -10%;
        }
        /* Glassmorphic card styling */
        .glass-card {
            background: rgba(30, 33, 37, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 151, 167, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 24px;
            padding: 40px 32px;
            max-w: 420px;
            width: 90%;
            text-align: center;
            box-sizing: border-box;
            z-index: 10;
        }
        .icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 194, 209, 0.1);
            border: 1px solid rgba(0, 194, 209, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
        }
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid var(--brand-cyan);
            animation: pulse-glow 2s infinite ease-out;
            opacity: 0;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px;
            background: linear-gradient(to right, var(--brand-white), var(--brand-gray));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: var(--brand-gray);
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .btn-reconnect {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, var(--brand-teal), var(--brand-cyan));
            color: var(--brand-dark-secondary);
            font-weight: 700;
            font-size: 14px;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 194, 209, 0.2);
            transition: transform 0.2s, opacity 0.2s;
            box-sizing: border-box;
        }
        .btn-reconnect:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-reconnect:active {
            transform: translateY(1px);
        }
        .logo-footer {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .logo-square {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--brand-teal), var(--brand-cyan));
            border-radius: 4px;
            display: inline-block;
        }
        @keyframes pulse-glow {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="tech-grid"></div>
    <div class="blur-sphere blur-sphere-1"></div>
    <div class="blur-sphere blur-sphere-2"></div>

    <div class="glass-card">
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#00C2D1" width="36" height="36">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856a9 9 0 0 1 13.788 0m-16.95-3.182a12.75 12.75 0 0 1 20.1 0M12 18.75h.007v.008H12v-.008Z" />
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>You are currently offline. Please check your internet connection or try reloading. Offline resources will sync automatically once online.</p>
        <button class="btn-reconnect" onclick="window.location.reload()">Try Reconnecting</button>

        <div class="logo-footer">
            <span class="logo-square"></span>
            <span>Diwebs Ecosystem Shell</span>
        </div>
    </div>
</body>
</html>
